schema_version: 1

context:
  name: csvtk
  version: "0.39.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/shenwei356/csvtk/archive/v${{ version }}.tar.gz
  sha256: 4c6cdae73e9ef357f2b511a9ff0c055d7abe6140afaf67e668008558425b1723
  patches:
    - fix-x-sys-ppc64le-pie.patch

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - csvtk --help

about:
  license: MIT
  license_file:
    - LICENSE
    - csvtk/license-files/
  summary: A cross-platform, efficient and practical CSV/TSV toolkit in Golang
  homepage: https://github.com/shenwei356/csvtk

extra:
  recipe-maintainers:
    - shenwei356
    - apcamargo
